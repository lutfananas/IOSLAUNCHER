name: Reset releases

# One-off: delete every GitHub Release and v* tag, then publish a fresh v1.0.0.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove all releases and tags'
        required: true

permissions:
  contents: write

jobs:
  reset:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete all releases
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
      - name: Delete leftover v* tags
        run: |
          for ref in $(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v" --jq '.[].ref'); do
            echo "Deleting $ref"
            gh api -X DELETE "repos/${{ github.repository }}/git/$ref"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk iOSLauncher-v1.0.0.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: iOS Launcher v1.0.0
          body_path: RELEASE_NOTES.md
          files: iOSLauncher-v1.0.0.apk
          make_latest: true
