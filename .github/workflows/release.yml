name: Release

# Push a tag like v1.0.0 → GitHub builds the APK and publishes a Release with it attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "iOSLauncher-${TAG}.apk"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: iOS Launcher ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: iOSLauncher-${{ env.TAG }}.apk
